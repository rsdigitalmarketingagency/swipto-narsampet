name: Build Swipto Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Prepare Assets Directory
        run: |
          mkdir -p assets
          if [ -f "icon.png" ]; then
            cp icon.png assets/icon.png
          fi

      - name: Build Android APK
        run: |
          flet build apk --project swipto --org com.swipto.narsampet --product "Swipto" --icon assets/icon.png swipto_app.py

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swipto-Release-APK
          path: build/apk/*.apk
