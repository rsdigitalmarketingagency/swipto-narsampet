name: Build Swipto Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Rename script to main.py
      run: |
        cp swipto_app.py main.py

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    - name: Accept Android Licenses
      run: |
        yes | sdkmanager --licenses || true

    - name: Install Flet CLI
      run: |
        python -m pip install --upgrade pip
        pip install "flet[all]"
        pip install -r requirements.txt

    - name: Build Android APK
      run: |
        flet build apk --project "Swipto" --org com.swipto.narsampet -v

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Swipto-Narsampet-APK
        path: build/apk/*.apk
