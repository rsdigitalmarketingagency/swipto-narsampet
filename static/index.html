<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Swipto - Food Delivery</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      min-height:100vh;
      background:linear-gradient(135deg,#ff9800,#ff3d00);
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .login-box{
      width:100%;
      max-width:440px;
      background:#ffffff;
      border-radius:25px;
      padding:40px 35px;
      text-align:center;
      box-shadow:0 15px 40px rgba(0,0,0,0.25);
    }

    .logo{
      font-size:44px;
      font-weight:bold;
      color:#f4511e;
      margin-bottom:12px;
    }

    .logo span{
      font-size:40px;
      margin-right:10px;
    }

    h2{
      font-size:28px;
      color:#222;
      margin-bottom:12px;
    }

    .subtitle{
      color:#666;
      font-size:16px;
      margin-bottom:30px;
    }

    .google-btn{
      width:100%;
      padding:16px;
      border:none;
      border-radius:12px;
      background:#ffffff;
      color:#333;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
      border:1px solid #ddd;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      transition:0.3s;
    }

    .google-btn:hover{
      background:#f5f5f5;
      transform:translateY(-2px);
    }

    .google-icon{
      width:24px;
      height:24px;
    }

    .status{
      margin-top:20px;
      font-size:15px;
      color:#d32f2f;
      min-height:22px;
    }

    .terms{
      margin-top:25px;
      color:#777;
      font-size:13px;
      line-height:1.5;
    }

    .user-info{
      display:none;
    }

    .logout-btn{
      width:100%;
      margin-top:15px;
      padding:14px;
      background:#f4511e;
      color:white;
      border:none;
      border-radius:12px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    .logout-btn:hover{
      background:#d84315;
    }

    .loading{
      display:none;
      margin-top:15px;
      color:#666;
    }
  </style>
</head>

<body>

  <!-- LOGIN PAGE -->
  <div class="login-box" id="loginBox">

    <div class="logo">
      <span>🍔</span>SWIPTO
    </div>

    <h2>Welcome to Swipto</h2>

    <p class="subtitle">
      Login with your Google account to continue
    </p>

    <button class="google-btn" onclick="googleLogin()">

      <svg class="google-icon" viewBox="0 0 48 48">
        <path fill="#EA4335"
        d="M24 9.5c3.54 0 6.71 1.22 9.21 3.61l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.2C12.43 13.72 17.74 9.5 24 9.5z"/>

        <path fill="#4285F4"
        d="M46.5 24.5c0-1.55-.14-3.04-.4-4.5H24v8.52h12.65c-.55 2.88-2.18 5.32-4.65 6.96l7.17 5.56C43.36 37.18 46.5 31.4 46.5 24.5z"/>

        <path fill="#FBBC05"
        d="M10.54 28.58A14.5 14.5 0 0 1 9.5 24c0-1.59.27-3.13.74-4.58l-7.98-6.2A23.94 23.94 0 0 0 0 24c0 3.87.93 7.53 2.56 10.78l7.98-6.2z"/>

        <path fill="#34A853"
        d="M24 48c6.48 0 11.93-2.14 15.9-5.84l-7.17-5.56c-2 1.34-4.56 2.13-8.73 2.13-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.2C6.51 42.62 14.62 48 24 48z"/>
      </svg>

      Continue with Google

    </button>

    <div class="loading" id="loading">
      Please wait... Signing in
    </div>

    <div class="status" id="status"></div>

    <p class="terms">
      By continuing, you agree to Swipto terms and conditions.
    </p>

  </div>


  <!-- USER PAGE -->
  <div class="login-box user-info" id="userBox">

    <div class="logo">
      <span>🍔</span>SWIPTO
    </div>

    <h2 id="welcomeText">Welcome</h2>

    <p class="subtitle" id="emailText"></p>

    <button class="logout-btn" onclick="logoutUser()">
      Logout
    </button>

  </div>


  <!-- FIREBASE -->
  <script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    // YOUR FIREBASE CONFIG
    const firebaseConfig = {

      apiKey: "AIzaSyB1CVXK70adafUvF9KH3Lv1fp-SaKDBVKc",

      authDomain: "swipto-7a20a.firebaseapp.com",

      projectId: "swipto-7a20a",

      storageBucket: "swipto-7a20a.firebasestorage.app",

      messagingSenderId: "56502022616",

      appId: "1:56502022616:web:d3bb24a5838f5baa2b42ad",

      measurementId: "G-PDXQPCJR5N"

    };


    // INITIALIZE FIREBASE
    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const provider = new GoogleAuthProvider();


    // GOOGLE LOGIN
    window.googleLogin = async function(){

      const status = document.getElementById("status");

      const loading = document.getElementById("loading");

      status.innerText = "";

      loading.style.display = "block";

      try{

        await signInWithPopup(auth, provider);

      }

      catch(error){

        console.error(error);

        status.innerText =
          "Login Error: " + error.message;

      }

      loading.style.display = "none";

    };


    // LOGOUT
    window.logoutUser = async function(){

      await signOut(auth);

    };


    // CHECK LOGIN STATUS
    onAuthStateChanged(auth, (user) => {

      const loginBox =
        document.getElementById("loginBox");

      const userBox =
        document.getElementById("userBox");


      if(user){

        loginBox.style.display = "none";

        userBox.style.display = "block";

        document.getElementById("welcomeText").innerText =
          "Welcome, " + (user.displayName || "Swipto User");

        document.getElementById("emailText").innerText =
          user.email;

      }

      else{

        loginBox.style.display = "block";

        userBox.style.display = "none";

      }

    });

  </script>

</body>
</html>
